<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pustaka Style Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bricolage+Grotesque:wght@500;700;800&family=Caveat:wght@600&family=DM+Serif+Display&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@500&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: toolbar on top, responsive card grid of looping previews, recipe sheet on click */
  --bg:#0e1014; --panel:#161a21; --line:#262c38; --text:#eceff4; --muted:#9aa3b2; --accent:#ff6a3d;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Instrument Sans',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:40px 20px 80px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,52px);line-height:1.05;margin:0 0 10px;text-wrap:balance}
.lead{color:var(--muted);max-width:62ch;margin:0 0 28px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);padding:12px 0;z-index:5}
.bar input{flex:1 1 220px;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 14px;font:inherit}
.bar input:focus-visible,.chip:focus-visible,.btn:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1a0d08;font-weight:600}
.count{color:var(--muted);font-size:14px;margin:6px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s,transform .15s}
.card:hover{border-color:#3a4252;transform:translateY(-2px)}
.cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.tag{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.card h3{font-family:var(--display);font-size:19px;margin:0;font-weight:700}
.card p{margin:0;color:var(--muted);font-size:14px}
.row2{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.btn{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.btn:hover{border-color:#566078}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1a0d08;font-weight:600}
.empty{color:var(--muted);padding:40px 0;text-align:center}

/* modal */
.ov{position:fixed;inset:0;background:rgba(5,6,9,.78);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 16px;z-index:20}
.ov.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:860px;overflow:hidden}
.sh-top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
.sh-top h2{font-family:var(--display);margin:0;font-size:24px}
.sh-body{padding:18px;display:grid;gap:16px}
.rec{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;margin:0}
.rec dt{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.rec dd{margin:0}
textarea{width:100%;min-height:210px;background:#0e1117;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.55 'JetBrains Mono',monospace;resize:vertical}
.note{color:var(--muted);font-size:13px;min-height:1.4em}
@media(max-width:560px){.rec{grid-template-columns:1fr}.rec dt{padding-top:8px}}

/* ===== preview stage ===== */
.stage{aspect-ratio:16/9;container-type:size;position:relative;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--ff)}
.stage *{box-sizing:border-box}
.stage i,.stage u,.stage s{display:block;text-decoration:none}
.cap{position:absolute;left:4cqw;right:4cqw;bottom:7cqh;text-align:center;font-size:5.4cqw;font-weight:700;line-height:1.1}
.cap.sm{font-size:4.6cqw}
.hd{position:absolute;left:50%;top:18cqh;width:26cqh;height:26cqh;border-radius:50%;background:var(--ac);transform:translateX(-50%)}
.bd{position:absolute;left:50%;top:48cqh;width:54cqh;height:64cqh;border-radius:50% 50% 0 0;background:var(--fg);opacity:.85;transform:translateX(-50%)}
.zg,.cg{position:absolute;inset:0}
.zg{transform-origin:50% 30%;animation:zm 6s ease-in-out infinite}
@keyframes zm{0%,25%{transform:scale(1)}40%,68%{transform:scale(1.4)}85%,100%{transform:scale(1)}}
.cg{animation:cutz 4s steps(1) infinite}
@keyframes cutz{0%{transform:scale(1)}25%{transform:scale(1.5) translate(-8%,6%)}50%{transform:scale(1.15) translate(9%,-2%)}75%{transform:scale(1.7) translate(0,10%)}}
.sl{position:absolute;left:12cqw;top:50%;transform:translateY(-54%);width:76cqw;display:grid;gap:5cqh}
.row{display:flex;align-items:center;gap:3cqw;font-size:6.4cqw;font-weight:700;opacity:0;animation:pop 6s ease-out infinite}
.row b{background:var(--ac);color:var(--bg);padding:.3cqw 1.8cqw;border-radius:1cqw;font-size:4.8cqw}
@keyframes pop{0%{opacity:0;transform:translateX(-6cqw)}10%,84%{opacity:1;transform:none}94%,100%{opacity:0}}
.sc{position:absolute;top:0;left:0;width:200%;height:100%;background:linear-gradient(180deg,var(--bg),var(--ac));animation:pan 9s linear infinite alternate}
@keyframes pan{to{transform:translateX(-50%)}}
.sun{position:absolute;left:62%;top:14cqh;width:16cqh;height:16cqh;border-radius:50%;background:#fff;opacity:.9}
.h1,.h2{position:absolute;bottom:-18cqh;height:52cqh;border-radius:50% 50% 0 0;background:rgba(0,0,0,.32)}
.h1{left:-5%;width:55%}.h2{left:45%;width:60%;background:rgba(0,0,0,.45)}
.rv{position:absolute;inset:0;animation:rvl 5s ease-out infinite}
.bx{position:absolute;left:50%;top:12cqh;width:28cqh;height:42cqh;margin-left:-14cqh;border-radius:3cqh;background:linear-gradient(145deg,var(--ac),color-mix(in srgb,var(--ac) 40%,var(--bg)));box-shadow:0 3cqh 6cqh rgba(0,0,0,.35)}
@keyframes rvl{0%{opacity:0;transform:scale(.6);filter:blur(1.2cqw)}25%,80%{opacity:1;transform:none;filter:none}100%{opacity:0}}
.w{position:absolute;left:0;right:0;top:50%;margin-top:-9cqw;text-align:center;font-size:14cqw;font-weight:800;line-height:1;opacity:0;animation:slam 6s ease-out infinite}
.w:nth-child(3){color:var(--ac)}
@keyframes slam{0%{opacity:0;transform:scale(2.2)}5%{opacity:1;transform:scale(1)}30%{opacity:1}33.3%,100%{opacity:0}}
.kin .w{font-size:15cqw}.kin .w:nth-child(2){transform-origin:center;animation-name:slam2}
@keyframes slam2{0%{opacity:0;transform:translateX(-30cqw) skewX(-12deg)}5%{opacity:1;transform:none}30%{opacity:1}33.3%,100%{opacity:0}}
.brut .w{font-size:12cqw;text-shadow:.9cqw .9cqw 0 var(--ac)}
.brut::after{content:"";position:absolute;inset:3cqh 3cqw;border:.8cqw solid var(--fg)}
.cd{position:absolute;left:20cqw;top:10cqh;width:60cqw;height:58cqh;border:.4cqw solid rgba(160,170,190,.4);background:rgba(255,255,255,.05);border-radius:2cqw;padding:5cqh 4cqw;display:grid;gap:3cqh;align-content:start}
.cd u{height:3cqh;border-radius:2cqh;background:rgba(160,170,190,.35)}
.cd u:nth-child(2){width:70%}.cd u:nth-child(3){width:85%}
.cd svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cd circle{fill:none;stroke:var(--ac);stroke-width:1.2;stroke-dasharray:100;stroke-dashoffset:100;animation:ring 5s ease-in-out infinite}
.cd s{position:absolute;right:4cqw;bottom:4cqh;background:var(--ac);color:var(--bg);padding:.4cqw 1.6cqw;border-radius:1cqw;font-size:3.6cqw;font-weight:700;opacity:0;animation:lbl 5s infinite}
@keyframes ring{0%{stroke-dashoffset:100}35%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:100}}
@keyframes lbl{0%,30%{opacity:0}40%,80%{opacity:1}100%{opacity:0}}
.sp{position:absolute;inset:0;display:flex}
.pn{flex:1;display:grid;place-items:center;font-size:12cqw;font-weight:800;background:color-mix(in srgb,var(--ac) calc(25% + var(--i)*25%),var(--bg));border-right:.5cqw solid var(--bg);transform:translateY(calc(var(--d)*110%));animation:slide 5s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes slide{0%{transform:translateY(calc(var(--d)*110%))}18%,82%{transform:none}100%{transform:translateY(calc(var(--d)*110%))}}
.pn em{font-style:normal;opacity:.9}
.pv{position:absolute;inset:0;transform-origin:50% 76%;animation:pvz 6s ease-in-out infinite}
@keyframes pvz{0%,20%{transform:scale(1)}40%,75%{transform:scale(1.7)}100%{transform:scale(1)}}
.ui{position:absolute;left:32cqw;top:8cqh;width:36cqw;height:70cqh;border-radius:3cqw;background:var(--fg);padding:5cqh 3cqw;display:grid;gap:3cqh;align-content:start}
.ui u{height:3cqh;border-radius:2cqh;background:rgba(255,255,255,.25)}.ui u:nth-child(2){width:65%}
.bt{position:absolute;left:3cqw;right:3cqw;bottom:5cqh;background:var(--ac);color:#fff;border-radius:1.4cqw;text-align:center;padding:1.2cqh 0;font-size:3cqw;font-weight:700}
.bt::after{content:"";position:absolute;left:50%;top:50%;width:6cqw;height:6cqw;margin:-3cqw;border:.5cqw solid var(--ac);border-radius:50%;animation:rip 6s infinite;opacity:0}
@keyframes rip{0%,45%{opacity:0;transform:scale(.3)}50%{opacity:1}75%,100%{opacity:0;transform:scale(2.4)}}
.mt{position:absolute;top:26cqh;width:26cqh;height:26cqh;background:var(--ac);border-radius:50%;animation:mtc 4.5s ease-in-out infinite}
@keyframes mtc{0%,100%{left:12cqw;border-radius:50%;background:var(--ac);transform:none}33%{left:44cqw;border-radius:0;background:var(--fg);transform:rotate(45deg)}66%{left:70cqw;border-radius:50% 0;background:var(--ac);transform:rotate(180deg)}}
.mi{position:absolute;left:0;top:0;width:56%;height:100%;background:linear-gradient(160deg,var(--ac),color-mix(in srgb,var(--ac) 30%,var(--fg)));animation:kb 8s ease-in-out infinite alternate;transform-origin:30% 50%}
@keyframes kb{to{transform:scale(1.12)}}
.mh{position:absolute;left:60%;right:4cqw;top:50%;transform:translateY(-50%);animation:rise 5s ease-out infinite}
.mh small{display:block;font:600 2.6cqw var(--ff);letter-spacing:.2em;color:var(--ac);margin-bottom:2cqh}
.mh b{font-size:7.2cqw;line-height:1;font-weight:400}
@keyframes rise{0%{opacity:0;transform:translateY(-30%)}20%,85%{opacity:1;transform:translateY(-50%)}100%{opacity:0}}
.dc{position:absolute;left:19cqw;top:10cqh;width:62cqw;height:72cqh;background:rgba(255,255,255,.5);padding:5cqh 4cqw;display:grid;gap:4cqh;align-content:start;box-shadow:0 1cqh 3cqh rgba(0,0,0,.25)}
.dc small{font-size:4.4cqw;font-weight:700;letter-spacing:.1em}
.dc u{height:2.6cqh;background:rgba(0,0,0,.28)}
.dc .hl{background:transparent;position:relative}.dc .hl::after{content:"";position:absolute;left:0;top:0;height:100%;background:#ffe14d;mix-blend-mode:multiply;width:0;animation:hlw 5s infinite}
@keyframes hlw{0%,15%{width:0}40%,85%{width:90%}100%{width:0}}
.dc s{position:absolute;right:3cqw;bottom:5cqh;border:.7cqw solid var(--ac);color:var(--ac);padding:.5cqw 2cqw;font-size:4.6cqw;font-weight:700;transform:rotate(-12deg);opacity:0;animation:stamp 5s infinite}
@keyframes stamp{0%,40%{opacity:0;transform:rotate(-12deg) scale(2)}50%,85%{opacity:1;transform:rotate(-12deg) scale(1)}100%{opacity:0}}
.mp{position:absolute;inset:0;width:100%;height:100%}
.mp path.rt{fill:none;stroke:var(--ac);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:dr 5s ease-in-out infinite}
.mp path.bgp{fill:none;stroke:var(--fg);stroke-width:.4;stroke-dasharray:1.5 2.5;opacity:.5}
@keyframes dr{0%{stroke-dashoffset:100}60%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
.cb{position:absolute;left:14cqw;bottom:18cqh;width:72cqw;height:50cqh;display:flex;align-items:flex-end;gap:3cqw}
.cb i{flex:1;height:var(--h);background:color-mix(in srgb,var(--fg) 45%,var(--bg));border-radius:.8cqw .8cqw 0 0;transform-origin:bottom;animation:grow 5s ease-out infinite}
.cb i:last-child{background:var(--ac)}
@keyframes grow{0%{transform:scaleY(0)}35%,85%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.bn{position:absolute;left:14cqw;top:8cqh;font-size:9cqw;font-weight:800;color:var(--ac)}
.gl{position:absolute;left:0;right:0;top:50%;margin-top:-6cqw;text-align:center;font-size:9cqw;font-weight:800;color:var(--fg);animation:gw 3s ease-in-out infinite}
@keyframes gw{0%,100%{text-shadow:0 0 .8cqw var(--ac),0 0 2cqw var(--ac)}50%{text-shadow:0 0 1.6cqw var(--ac),0 0 5cqw var(--ac),0 0 9cqw var(--ac)}}
.neon .gl{text-shadow:0 0 1cqw #ff2bd6,0 0 3cqw #ff2bd6,.4cqw .4cqw 2cqw #00e5ff}
.ln{position:absolute;left:25cqw;right:25cqw;top:66cqh;height:.6cqh;background:linear-gradient(90deg,transparent,var(--ac),transparent);animation:lnn 3s ease-in-out infinite}
@keyframes lnn{0%,100%{transform:scaleX(.3);opacity:.4}50%{transform:scaleX(1);opacity:1}}
.ly i{position:absolute;width:44cqw;height:46cqh;border-radius:2cqw;left:calc(16cqw + var(--i)*10cqw);top:calc(8cqh + var(--i)*9cqh);background:color-mix(in srgb,var(--ac) calc(25% + var(--i)*25%),var(--bg));animation:fl 4s ease-in-out infinite;animation-delay:calc(var(--i)*.4s)}
@keyframes fl{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-3cqh) rotate(var(--r,0deg))}}
.ly.tilt i{--r:calc((var(--i) - 1)*5deg);background:#efe3c8;box-shadow:0 1cqh 2cqh rgba(0,0,0,.3)}
.ly.tilt i:nth-child(2){background:#fff}.ly.tilt i::before{content:"";position:absolute;left:50%;top:-1.4cqh;width:10cqw;height:3cqh;margin-left:-5cqw;background:rgba(255,215,90,.8);transform:rotate(-4deg)}
.ly.glass i{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(6px)}
.ly.paper i{box-shadow:0 1.4cqh 2.4cqh rgba(0,0,0,.3)}
.lx{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:3cqh}
.lx i{width:30cqw;height:.5cqh;background:var(--fg);animation:lw 5s ease-in-out infinite}
@keyframes lw{0%{transform:scaleX(0)}30%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.lx b{font-size:9cqw;font-weight:400;animation:lt 5s ease-out infinite}
@keyframes lt{0%{opacity:0;letter-spacing:.4em}35%,85%{opacity:1;letter-spacing:.06em}100%{opacity:0}}
.lx small{font-size:2.4cqw;letter-spacing:.4em;color:var(--ac)}
.bl{position:absolute;width:44cqh;height:44cqh;filter:blur(1.5cqh);opacity:.9;animation:mo 7s ease-in-out infinite}
.bl.a{left:12cqw;top:10cqh;background:linear-gradient(135deg,var(--ac),#fff)}
.bl.b{left:46cqw;top:28cqh;background:linear-gradient(135deg,var(--fg),var(--ac));animation-delay:-2s}
.bl.c{left:30cqw;top:-8cqh;width:30cqh;height:30cqh;background:var(--ac);animation-delay:-4s}
@keyframes mo{0%,100%{border-radius:60% 40% 55% 45%/50% 60% 40% 50%;transform:translate(0,0)}50%{border-radius:40% 60% 45% 55%/60% 40% 60% 40%;transform:translate(6cqw,4cqh)}}
.bt2{position:absolute;left:0;right:0;bottom:9cqh;text-align:center;font-size:5.6cqw;font-weight:700}
.gd{position:absolute;left:14cqw;top:10cqh;width:72cqw;height:64cqh;display:grid;grid-template-columns:1fr 1fr;gap:2cqw}
.gd i{background:rgba(255,255,255,.07);border:.3cqw solid transparent;border-radius:2cqw;display:grid;place-items:center;font-size:5cqw;font-weight:700;animation:hi 8s infinite}
@keyframes hi{0%,2%{background:var(--ac);color:var(--bg);transform:scale(1.04)}22%,100%{background:rgba(255,255,255,.07);transform:none}}
.sw{position:absolute;left:7cqw;top:10cqh;width:55cqw;font-size:9.5cqw;font-weight:800;line-height:.95;text-transform:uppercase;animation:rise2 5s ease-out infinite}
@keyframes rise2{0%{opacity:0;transform:translateX(-8cqw)}20%,85%{opacity:1;transform:none}100%{opacity:0}}
.dot{position:absolute;right:10cqw;top:16cqh;width:34cqh;height:34cqh;border-radius:50%;background:var(--ac);animation:dt 5s ease-in-out infinite}
@keyframes dt{0%{transform:translateX(30cqw) scale(.3)}30%,85%{transform:none}100%{transform:translateX(30cqw) scale(.3)}}
.rl{position:absolute;left:7cqw;right:7cqw;bottom:12cqh;height:1.2cqh;background:var(--fg);transform-origin:left;animation:lw 5s ease-in-out infinite}
.co{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:1.4cqw 1cqw;padding:0 8cqw;font-size:13cqw}
.co span{padding:0 1.4cqw;color:#111;background:var(--c);transform:rotate(var(--r));line-height:1.15;animation:ppop 4s ease-out infinite;opacity:0}
@keyframes ppop{0%{opacity:0;transform:scale(0) rotate(var(--r))}12%,88%{opacity:1;transform:rotate(var(--r))}100%{opacity:0}}
.im{position:absolute;inset:0;background:repeating-linear-gradient(115deg,var(--bg) 0 4cqw,color-mix(in srgb,var(--ac) 25%,var(--bg)) 4cqw 8cqw);display:grid;place-items:center}
.im b{font-size:13cqw;color:var(--fg);text-shadow:.8cqw .8cqw 0 var(--ac);animation:shk 2.4s infinite}
@keyframes shk{0%,50%{transform:scale(.9)}56%{transform:scale(1.25) rotate(-3deg)}60%{transform:scale(1.1) translate(1cqw,-1cqw)}64%{transform:scale(1.2) translate(-1cqw,1cqw)}70%,100%{transform:scale(1)}}
.im::after{content:"";position:absolute;inset:0;background:#fff;opacity:0;animation:fls 2.4s infinite}
@keyframes fls{0%,53%{opacity:0}56%{opacity:.85}62%,100%{opacity:0}}
.vx{position:absolute;inset:0}
.vx i{position:absolute;bottom:26cqh;width:20cqh;height:20cqh;animation:bn 1.8s ease-in-out infinite}
.vx .c{left:22cqw;background:var(--ac);border-radius:50%}
.vx .tr{left:calc(50cqw - 10cqh);background:var(--fg);clip-path:polygon(50% 0,100% 100%,0 100%);animation-delay:.3s}
.vx .sq{right:22cqw;background:#ffb703;border-radius:2cqh;animation-delay:.6s}
@keyframes bn{0%,100%{transform:translateY(0) scaleY(1)}40%{transform:translateY(-16cqh) scaleY(1.05)}80%{transform:translateY(0) scaleY(.85)}}
.vx.stop i{animation-timing-function:steps(4,end);animation-duration:1.4s}.vx.stop i{border-radius:.6cqh}.vx.stop .c{border-radius:50%}
.vx.clay i{box-shadow:inset -1.4cqh -1.4cqh 2cqh rgba(0,0,0,.2),inset 1cqh 1cqh 1.6cqh rgba(255,255,255,.5),0 2cqh 2cqh rgba(0,0,0,.15)}.vx.clay .tr{clip-path:none;border-radius:50% 50% 30% 30%}
.is{position:absolute;left:50%;top:56%}

function words(t){return t.split("|")}
function KIND(s){
  var t=s.t, w=words(t), m=s.o.m||"", h="";
  switch(s.k){
  case"zoom": h='<div class="zg"><i class="hd"></i><i class="bd"></i></div><div class="cap">'+t+'</div>';break;
  case"cut": h='<div class="cg"><i class="hd"></i><i class="bd"></i></div><div class="cap sm">'+t+'</div>';break;
  case"steps": h='<div class="sl">'+w.map(function(x,i){return '<div class="row" style="animation-delay:'+(i*.6)+'s"><b>0'+(i+1)+'</b><span>'+x+'</span></div>'}).join("")+'</div>';break;
  case"pan": h='<div class="sc"><i class="sun"></i><i class="h1"></i><i class="h2"></i></div><div class="cap">'+t+'</div>';break;
  case"reveal": h='<div class="rv"><i class="bx"></i></div><div class="cap">'+t+'</div>';break;
  case"kw": h='<div class="'+m+'">'+w.map(function(x,i){return '<b class="w" style="animation-delay:'+(i*2)+'s">'+x+'</b>'}).join("")+'</div>';break;
  case"callout": h='<div class="cd"><u></u><u></u><u></u><svg viewBox="0 0 100 100" preserveAspectRatio="none"><circle cx="68" cy="52" r="14" pathLength="100"/></svg><s>Bukti</s></div><div class="cap sm">'+t+'</div>';break;
  case"split": var n=s.o.n||2,lab=["A","B","C"];h='<div class="sp">';for(var i=0;i<n;i++){h+='<div class="pn" style="--i:'+i+';--d:'+(i%2?1:-1)+';animation-delay:'+(i*.25)+'s"><em>'+(w[i]||lab[i])+'</em></div>'}h+='</div>';break;
  case"pov": h='<div class="pv"><div class="ui"><u></u><u></u><u></u><b class="bt">Teruskan</b></div></div><div class="cap sm" style="top:6cqh;bottom:auto;text-align:left">'+t+'</div>';break;
  case"match": h='<i class="mt"></i><div class="cap sm">'+t+'</div>';break;
  case"mag": h='<div class="mi"></div><div class="mh"><small>EDISI KHAS</small><b>'+t+'</b></div>';break;
  case"doss": h='<div class="dc"><small>'+t+'</small><u></u><u></u><u class="hl"></u><u></u><s>TERBUKTI</s></div>';break;
  case"map": h='<svg class="mp" viewBox="0 0 160 90"><path class="bgp" d="M0 30 H160 M0 60 H160 M40 0 V90 M110 0 V90"/><path class="rt" pathLength="100" d="M18 70 C40 20,70 85,100 42 S140 28,146 20"/><circle cx="18" cy="70" r="2.4" fill="currentColor"/><circle r="3.4" fill="var(--ac)"><animateMotion dur="5s" repeatCount="indefinite" path="M18 70 C40 20,70 85,100 42 S140 28,146 20"/></circle></svg><div class="cap sm">'+t+'</div>';break;
  case"chart": h='<b class="bn">'+t+'</b><div class="cb">'+[30,46,38,68,90].map(function(v,i){return '<i style="--h:'+v+'%;animation-delay:'+(i*.15)+'s"></i>'}).join("")+'</div><div class="cap sm" style="bottom:5cqh">Pertumbesaran bulanan</div>';break;
  case"draw": h='<svg class="mp" viewBox="0 0 160 90"><path class="rt" pathLength="100" d="M14 68 C36 14,72 14,84 48 S126 82,146 26" style="'+(m=="grid"?"":"stroke-width:2.2")+'"/><circle class="rt" pathLength="100" cx="146" cy="26" r="9" style="animation-delay:.5s;fill:none"/></svg><div class="cap sm">'+t+'</div>';break;
  case"glow": h='<div class="'+m+'"><div class="gl">'+t+'</div><i class="ln"></i></div>';break;
  case"layers": h='<div class="ly '+m+'"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i></div><div class="cap">'+t+'</div>';break;
  case"lux": h='<div class="lx"><i></i><b>'+t+'</b><small>EST. 2025</small></div>';break;
  case"blob": h='<i class="bl a"></i><i class="bl b"></i><i class="bl c"></i><div class="bt2">'+t+'</div>';break;
  case"grid": h='<div class="gd">'+["Pantas","Ringan","Selamat","Murah"].map(function(x,i){return '<i style="animation-delay:'+(i*2)+'s">'+x+'</i>'}).join("")+'</div><div class="cap sm" style="bottom:3cqh">'+t+'</div>';break;
  case"swiss": h='<div class="sw">'+t+'</div><i class="dot"></i><i class="rl"></i>';break;
  case"collage": var cols=["#ffffff","var(--ac)","#ffd166","#9bf6ff"],rots=[-5,4,-3,6,-6,3],c=0;h='<div class="co">';t.replace(/\s/g,"").split("").forEach(function(ch,i){h+='<span style="--c:'+cols[i%4]+';--r:'+rots[i%6]+'deg;animation-delay:'+(i*.2)+'s">'+ch+'</span>'});h+='</div>';break;
  case"impact": h='<div class="im"><b>'+t+'</b></div>';break;
  case"vec": h='<div class="vx '+m+'"><i class="c"></i><i class="tr"></i><i class="sq"></i></div><div class="cap">'+t+'</div>';break;
  case"iso": h='<div class="is"><i style="--z:0"></i><i style="--z:1"></i><i style="--z:2"></i></div><div class="cap sm">'+t+'</div>';break;
  case"grain": h='<div class="gr"><small>REC 03:14</small><b>'+t+'</b></div><i class="vg"></i>';break;
  case"win": h='<div class="wn"><div class="tb"><span>'+t+'</span><i></i></div><div class="bdy"><u></u><u></u><u></u></div></div><i class="cur"></i>';break;
  case"pixel": h='<div class="pxt">'+t+'</div><div class="pxr"><i></i><b style="left:30%"></b><b style="left:55%"></b><b style="left:80%"></b></div>';break;
  case"keynote": h='<i class="kn-glow"></i><div class="kn-h">'+t+'</div><div class="kn-dev"><i class="kn-sheen"></i></div><div class="kn-s">Tersedia 21 September</div>';break;
  case"vox": h='<div class="vo-ph"><i></i><small>ARKIB 2019</small></div><div class="vo-t">'+w[0]+' <mark>'+(w[1]||"")+'</mark> '+(w[2]||"")+'</div><svg class="vo-sv" viewBox="0 0 160 90"><ellipse pathLength="100" cx="48" cy="38" rx="34" ry="24"/><path pathLength="100" d="M84 58 C 100 46,116 54,124 36"/></svg><div class="vo-l3"><b>PENJELAS</b><span>Apa yang berlaku?</span></div>';break;
  case"comic": h='<div class="cm"><i></i><b>'+t+'</b></div>';break;
  }
  return h;
}
var S=D.map(function(r,i){return{id:i,n:r[0],c:r[1],d:r[2],k:r[3],bg:r[4],fg:r[5],ac:r[6],f:r[7],t:r[8],mood:r[9],warna:r[10],gerak:r[11],teks:r[12],o:r[13]||{}}});
function stage(s){
  var st='--bg:'+s.bg+';--fg:'+s.fg+';--ac:'+s.ac+';--ff:'+FONTS[s.f][0]+';';
  if(s.o.m==="glass")st+='background:radial-gradient(circle at 25% 30%,#6a4cff,transparent 55%),radial-gradient(circle at 80% 70%,#00c2ff,transparent 50%),#1b1646;';
  if(s.o.m==="grid")st+='background-image:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);background-size:6cqw 6cqw;';
  if(s.o.m==="paper"||s.k==="blob"&&s.n==="Soft Gradient Flow")st+='';
  if(s.n==="Soft Gradient Flow")st+='background:linear-gradient(135deg,#fbe3e8,#e4d9ff);';
  if(s.n==="Liquid Shape Flow")st+='background:radial-gradient(circle at 30% 20%,#2b3a8a,#10162f 65%);';
  if(s.n==="Neon Noir")st+='background:linear-gradient(180deg,#07060f,#1a0a2e);';
  if(s.n==="Dark Tech Glow")st+='background:radial-gradient(circle at 50% 55%,#10244a,#05070d 65%);';
  if(s.n==="Analog Film Diary")st+='background:radial-gradient(circle,#4a3320,#2a1d12);';
  return '<div class="stage'+(s.f==="p"?' f-p':'')+'" style="'+st+'">'+KIND(s)+'</div>';
}
function prompt(s){
  return 'Edit video ini dalam style "'+s.n+'".\n\nKonsep: '+s.d+'\nMood: '+s.mood+'\nWarna: '+s.warna+'\nFont: '+FONTS[s.f][1]+'\nGerakan dan transisi: '+s.gerak+'\nTeks di skrin: '+s.teks+'\n\nBahan: [tampal footage, skrip, logo dan warna jenama di sini]\nMesej utama: [isi satu ayat]\nFormat: 9:16, 1080x1920, 30 fps.\n\nPeraturan: kekalkan satu hierarki visual yang jelas, jangan tambah elemen di luar style ini, dan pastikan teks mudah dibaca pada skrin telefon.';
}
var cats=["Semua"].concat(S.map(function(s){return s.c}).filter(function(c,i,a){return a.indexOf(c)===i}));
var cur="Semua",grid=document.getElementById("grid"),q=document.getElementById("q");
function chips(){
  var el=document.getElementById("chips");el.innerHTML="";
  cats.forEach(function(c){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=c;b.setAttribute("aria-pressed",c===cur);b.onclick=function(){cur=c;chips();render()};el.appendChild(b)});
}
function render(){
  var term=q.value.trim().toLowerCase();
  var list=S.filter(function(s){
    if(cur!=="Semua"&&s.c!==cur)return false;
    if(!term)return true;
    return (s.n+" "+s.d+" "+s.mood+" "+s.warna+" "+s.c).toLowerCase().indexOf(term)>-1;
  });
  grid.innerHTML="";
  list.forEach(function(s){
    var a=document.createElement("article");a.className="card";a.tabIndex=0;
    a.innerHTML=stage(s)+'<div class="cbody"><span class="tag">'+s.c+'</span><h3>'+s.n+'</h3><p>'+s.d+'</p><div class="row2"><button class="btn pri" type="button" data-a="copy">Salin prompt</button><button class="btn" type="button" data-a="open">Lihat resipi</button></div></div>';
    a.onclick=function(e){var act=e.target.getAttribute&&e.target.getAttribute("data-a");if(act==="copy"){e.stopPropagation();copy(prompt(s),e.target)}else open(s)};
    a.onkeydown=function(e){if(e.key==="Enter"&&e.target===a)open(s)};
    grid.appendChild(a);
  });
  document.getElementById("count").textContent=list.length+" daripada "+S.length+" style";
  document.getElementById("empty").hidden=list.length>0;
}
function copy(text,btn,note){
  function done(ok){
    if(btn&&btn.tagName==="BUTTON"){var o=btn.textContent;btn.textContent=ok?"Disalin":"Gagal salin";setTimeout(function(){btn.textContent=o},1400)}
    if(note)note.textContent=ok?"Prompt disalin ke clipboard.":"Salin automatik tidak dibenarkan. Pilih teks dalam kotak dan tekan Ctrl+C.";
  }
  try{navigator.clipboard.writeText(text).then(function(){done(true)},function(){done(false)})}catch(e){done(false)}
}
var ov=document.getElementById("ov"),lastFocus=null,openS=null;
function open(s){
  openS=s;lastFocus=document.activeElement;
  document.getElementById("mt").textContent=s.n;
  document.getElementById("mstage").innerHTML=stage(s);
  document.getElementById("rec").innerHTML=[["Kategori",s.c],["Konsep",s.d],["Mood",s.mood],["Warna",s.warna],["Font",FONTS[s.f][1]],["Gerakan",s.gerak],["Teks skrin",s.teks]].map(function(r){return '<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>'}).join("");
  var p=document.getElementById("pr");p.value=prompt(s);
  document.getElementById("nt").textContent="";
  ov.classList.add("on");document.getElementById("x").focus();
}
function close(){ov.classList.remove("on");document.getElementById("mstage").innerHTML="";if(lastFocus)lastFocus.focus()}
document.getElementById("x").onclick=close;
ov.onclick=function(e){if(e.target===ov)close()};
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&ov.classList.contains("on"))close()});
document.getElementById("cp").onclick=function(e){var p=document.getElementById("pr");p.select();copy(p.value,e.target,document.getElementById("nt"))};
q.oninput=render;
chips();render();
</script>
